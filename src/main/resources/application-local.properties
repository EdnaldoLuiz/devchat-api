# App
spring.application.name=websocket
spring.main.banner-mode=off
server.port=${SERVER_PORT:8080}
spring.main.web-application-type=SERVLET
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
snowflake.datacenter-id=${SNOWFLAKE_DATACENTER_ID:1}
snowflake.machine-id=${SNOWFLAKE_MACHINE_ID:1}

# Security
application.security.jwt.secret-key=${JWT_SECRET:secret}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=86400000

# Metrics
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.metrics.tags.application=websocket

# Logging
logging.level.org.springframework=INFO
logging.level.com.websocket=DEBUG
logging.level.org.hibernate=ERROR
spring.output.ansi.enabled=ALWAYS

# DB
## MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/websocket?useSSL=false&allowPublicKeyRetrieval=true&useTimezone=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=06022003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.username=redis
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=3000

## JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

## Flyway
spring.flyway.url=jdbc:mysql://localhost:3306/websocket?useSSL=false&allowPublicKeyRetrieval=true&erverTimezone=America/Sao_Paulo
spring.flyway.user=root
spring.flyway.password=06022003
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history

## Connection Pool (HikariCP)
spring.datasource.hikari.pool-name=${HIKARI_POOL_NAME:websocket}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.auto-commit=${HIKARI_AUTO_COMMIT:true}
spring.datasource.hikari.connection-test-query=${HIKARI_CONNECTION_TEST_QUERY:SELECT 1}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD:120000}