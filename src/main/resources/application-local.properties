##################################### App #####################################

# Base
spring.application.name=websocket
spring.main.banner-mode=off
spring.main.web-application-type=SERVLET
server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework=INFO
logging.level.com.websocket=DEBUG
logging.level.org.hibernate=ERROR
spring.output.ansi.enabled=ALWAYS

# TSID Generator
tsid.node=${TSID_NODE:1}
tsid.node-bits=${TSID_NODE_BITS:10}
tsid.custom-epoch=${TSID_CUSTOM_EPOCH:2020-01-01T00:00:00Z}

##################################### Security #####################################

# JWT
application.security.jwt.secret-key=${JWT_SECRET:secret}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:86400000}

# OAuth2
## GitHub 
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user
spring.security.oauth2.client.registration.github.redirect-uri=${BASE_URL}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-name=GitHub
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize?prompt=consent
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id

## Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri=${BASE_URL}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.client-name=Google

##################################### Database #####################################

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/websocket?useSSL=false&allowPublicKeyRetrieval=true&useTimezone=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=06022003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Flyway
spring.flyway.url=jdbc:mysql://localhost:3306/websocket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.flyway.user=root
spring.flyway.password=06022003
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=3000

# HikariCP Datasource
spring.datasource.hikari.pool-name=${HIKARI_POOL_NAME:websocket}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.auto-commit=${HIKARI_AUTO_COMMIT:true}
spring.datasource.hikari.connection-test-query=${HIKARI_CONNECTION_TEST_QUERY:SELECT 1}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD:120000}

##################################### AWS #####################################

# SES
aws.region=${AWS_REGION:sa-east-1}
aws.ses.sender=${AWS_SES_SENDER}
aws.ses.endpoint=${AWS_SES_ENDPOINT}
aws.accessKeyId=${AWS_SES_USERNAME:test}
aws.secretAccessKey=${AWS_SES_PASSWORD:test}
aws.ses.supportEmail=${AWS_SES_SUPPORT_EMAIL}
aws.ses.messageConfigurationSetName=${AWS_SES_MESSAGE_CONFIGURATION_SET_NAME}

# S3
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

##################################### Observability #####################################

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.metrics.tags.application=websocket

##################################### Thymeleaf #####################################

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML