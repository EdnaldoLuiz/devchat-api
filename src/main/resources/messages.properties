# LoginRequestDTO

# Mensagens customizadas para validação de senha (Passay)
INSUFFICIENT_LOWERCASE=Deve conter pelo menos 1 caractere minúsculo.
INSUFFICIENT_UPPERCASE=Deve conter pelo menos 1 caractere maiúsculo.
INSUFFICIENT_DIGIT=Deve conter pelo menos 1 dígito.
INSUFFICIENT_SPECIAL=Deve conter pelo menos 1 caractere especial.
TOO_SHORT=A senha deve ter 8 ou mais caracteres.
