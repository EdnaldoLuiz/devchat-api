# O JDBC URL aqui será sobrescrito pelo container dinamicamente em AbstractIntegrationTest
spring.datasource.url=${spring.datasource.url}
spring.datasource.username=${spring.datasource.username}
spring.datasource.password=${spring.datasource.password}
spring.datasource.driver-class-name=${spring.datasource.driver-class-name}

spring.datasource.hikari.connectionTimeout=90000
spring.datasource.hikari.maxLifetime=60000

tsid.node=${TSID_NODE:1}
tsid.node-bits=${TSID_NODE_BITS:10}
tsid.custom-epoch=${TSID_CUSTOM_EPOCH:2020-01-01T00:00:00Z}

application.security.jwt.secret-key=secretKeyTest123456789012345678901234567890
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=86400000

##################################### AWS #####################################

# SES
aws.region=sa-east-1
aws.ses.sender=test
aws.ses.endpoint=http://localhost:9999
aws.accessKeyId=test
aws.secretAccessKey=test
aws.ses.supportEmail=test
aws.ses.messageConfigurationSetName=test

# S3
aws.s3.bucket-name=test

# Ajustes de JPA/Hibernate para testes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Testes: Evitar logs massivos
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
spring.output.ansi.enabled=ALWAYS