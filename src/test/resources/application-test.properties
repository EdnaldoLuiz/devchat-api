spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS WEBSOCKET
spring.jpa.properties.hibernate.default_schema=WEBSOCKET
spring.sql.init.mode=always

spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.org.springframework=DEBUG
spring.flyway.enabled=false
snowflake.datacenter-id=${SNOWFLAKE_DATACENTER_ID:1}
snowflake.machine-id=${SNOWFLAKE_MACHINE_ID:1}

# Security
application.security.jwt.secret-key=${JWT_SECRET:teste}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=86400000