# O JDBC URL aqui será sobrescrito pelo container dinamicamente em AbstractIntegrationTest
app.cors.allowed-origins=*

spring.datasource.url=jdbc:mysql://localhost:3306/websocket?useSSL=false&allowPublicKeyRetrieval=true&useTimezone=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.connectionTimeout=90000
spring.datasource.hikari.maxLifetime=60000

tsid.node=${TSID_NODE:1}
tsid.node-bits=${TSID_NODE_BITS:10}
tsid.custom-epoch=${TSID_CUSTOM_EPOCH:2020-01-01T00:00:00Z}

application.security.jwt.secret-key=secretKeyTest123456789012345678901234567890
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=86400000

##################################### AWS #####################################

# SES
aws.region=sa-east-1
aws.ses.sender=test
aws.ses.endpoint=http://localhost:9999
aws.accessKeyId=test
aws.secretAccessKey=test
aws.ses.supportEmail=test
aws.ses.messageConfigurationSetName=test

# S3
aws.s3.bucket-name=test

# Ajustes de JPA/Hibernate para testes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Testes: Evitar logs massivos
logging.level.org.springframework=INFO
logging.level.org.springframework.boot.autoconfigure=ERROR
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.cloud=ERROR
logging.level.org.springframework.data=ERROR
logging.level.org.hibernate=ERROR
#logging.level.org.springframework.security=TRACE
logging.level.org.hibernate.SQL=ERROR
#logging.level.org.hibernate.type.descriptor.sql=TRACE
spring.output.ansi.enabled=ALWAYS




# OAuth2
## GitHub 
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user
spring.security.oauth2.client.registration.github.redirect-uri=${BASE_URL}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-name=GitHub
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize?prompt=consent
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id

## Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri=${BASE_URL}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.client-name=Google

spring.main.allow-bean-definition-overriding=true